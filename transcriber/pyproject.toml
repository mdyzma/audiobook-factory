# Environment A - "transcriber": WhisperX auto-labelling.
# Modern stack on purpose: numpy 2.x / pandas 2.x. Must NEVER contain `tts`.
# whisperx 3.8.1 requires pandas>=2.2.3, coqui tts 0.22.0 requires pandas<2.0 -
# that direct conflict is why this project uses split environments.
[project]
name = "transcriber"
version = "0.1.0"
description = "Voice-sample auto-labelling and audiobook QA (WhisperX)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # pyannote-audio (via whisperx) requires torchcodec, whose compiled
    # extension is built against one exact torch ABI. Resolving torch to 2.8
    # left torchcodec 0.16 unable to load, so pyannote silently fell back to a
    # slower path and printed a dlopen traceback on every run. These two must
    # move together with whatever torchcodec resolves to.
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "whisperx==3.8.1",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pydub>=0.25.1",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

# CUDA 12.4 wheels for the RTX 5090 box. Unused on Apple Silicon, which resolves
# to the default PyPI wheels with MPS support. Switch with: just gpu-torch
[tool.uv]
# whisperx 3.8.1 declares torchaudio>=2.8,<2.9. That bound is stricter than
# reality and it strands torchcodec, which pyannote-audio requires: torchcodec
# ships a compiled extension built against one exact torch ABI, and the recent
# builds are the only ones that support FFmpeg 9. Holding torch at 2.8 left
# torchcodec unloadable, so pyannote fell back to a slower decode path and
# printed a dlopen traceback on every run.
#
# Verified by running the real thing on torch 2.14: transcription, voice
# activity detection and forced alignment all work, with identical output.
# Revisit when whisperx widens the bound.
override-dependencies = [
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
