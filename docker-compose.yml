# Services share ./data, which is the only channel between them, exactly as the
# native pipeline does.
#
# Two profiles, because they need different hardware:
#
#   cpu  bookbinder and studio. No GPU, runs anywhere, including macOS.
#   gpu  narrator and transcriber. Needs an NVIDIA host with
#        nvidia-container-toolkit. There is no GPU passthrough on macOS.
#
#   docker compose --profile cpu build
#   docker compose --profile cpu run --rm bookbinder python -m bookbinder.chunk solaris

x-project: &project
  # /app is the project root inside every image, mirroring the repository so the
  # modules resolve data/ and config/ the same way they do natively.
  volumes:
    - ./data:/app/data
    - ./config:/app/config:ro
  working_dir: /app

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  bookbinder:
    <<: *project
    profiles: [cpu]
    build:
      context: .
      dockerfile: apps/bookbinder/Dockerfile
    image: audiobook-factory/bookbinder
    working_dir: /app/apps/bookbinder

  studio:
    <<: *project
    profiles: [cpu]
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
    image: audiobook-factory/studio
    working_dir: /app/apps/studio
    ports:
      # Bound to localhost on purpose. This dashboard serves everything under
      # data/ and has no authentication.
      - "127.0.0.1:8765:8765"

  transcriber:
    <<: [*project, *gpu]
    profiles: [gpu]
    build:
      context: .
      dockerfile: apps/transcriber/Dockerfile
    image: audiobook-factory/transcriber
    working_dir: /app/apps/transcriber
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      # Whisper weights are large; keep them across rebuilds.
      - whisper-cache:/root/.cache

  narrator:
    <<: [*project, *gpu]
    profiles: [gpu]
    build:
      context: .
      dockerfile: apps/narrator/Dockerfile
    image: audiobook-factory/narrator
    working_dir: /app/apps/narrator
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./training:/app/training
      # XTTS-v2 is ~1.7 GB and would otherwise download on every run.
      - xtts-cache:/root/.local/share/tts

volumes:
  whisper-cache:
  xtts-cache:
