# Environment B - "bookbinder": pure-Python text and container work.
# No torch, no ML. Ingests ebooks, chunks them, muxes the final audiobook.
# Kept separate so ebook parsing never drags spaCy/pydantic into the TTS env.
[project]
name = "bookbinder"
version = "0.1.0"
description = "Ebook ingestion, TTS chunking and audiobook assembly"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypdf>=4.2.0",
    "pysbd>=0.3.4",
    "ftfy>=6.2.0",
    "mutagen>=1.47.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "charset-normalizer>=3.5.1",
    "lingua-language-detector>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookbinder"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
